<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>big incontri</title>

  <!-- Meta tag per abilitare la PWA -->
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="big incontri" />
  
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f0f9ff;
      color: #0f172a;
    }
    .background-cover {
      background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.25) 0%, rgba(15, 23, 42, 0.85) 100%), url('cover.jpg');
      background-size: cover;
      background-position: center;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between overflow-x-hidden antialiased selection:bg-indigo-500/20">

  <!-- Schermata di BENVENUTO (Prima Visita) -->
  <div id="first-load-view" class="hidden min-h-screen flex flex-col justify-between background-cover p-6 text-white">
    <header class="flex justify-between items-center py-4">
      <div class="h-10 w-10 rounded-xl bg-white/10 backdrop-blur-md flex items-center justify-center font-bold border border-white/20">
        B
      </div>
      <span class="text-xs bg-white/10 backdrop-blur-md px-3 py-1.5 rounded-full font-semibold border border-white/10">
        ✨ PWA Installabile
      </span>
    </header>

    <main class="max-w-xl mx-auto w-full space-y-6 my-auto text-center sm:text-left">
      <div class="space-y-3">
        <span class="inline-block px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wider bg-amber-500 text-amber-950">
          Benvenuto
        </span>
        <h1 class="text-3xl sm:text-5xl font-black tracking-tight leading-none">
          big incontri
        </h1>
        
      </div>

      <div class="pt-4 flex flex-col sm:flex-row gap-3">
        <button 
          onclick="handleMainButtonClick()" 
          class="bg-white hover:bg-slate-100 text-slate-950 font-bold py-4 px-6 rounded-2xl shadow-lg transition duration-200 flex items-center justify-center gap-2 text-sm active:scale-[0.98] cursor-pointer"
        >
          Accedi Ora
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
        <div class="text-xs text-slate-300 self-center">
          Creato da <strong>Samu e Ile</strong>
        </div>
      </div>
    </main>

    <footer class="text-center text-[10px] text-slate-400/80 py-4 border-t border-white/5">
      Cliccando su Accedi verrai collegato. I prossimi accessi saranno automatici all'istante!
    </footer>
  </div>

  <!-- Schermata di REINDIRIZZAMENTO AUTOMATICO (Visite Successive) -->
  <div id="redirect-loader-view" class="hidden min-h-screen flex flex-col justify-center items-center p-6 text-slate-800" style="background-color: #f0f9ff">
    <div class="max-w-md w-full space-y-8 text-center flex flex-col items-center">
      
      <!-- App icon mockup centered -->
      <div 
        class="w-20 h-20 rounded-3xl shadow-xl flex items-center justify-center text-white font-extrabold text-2xl border-2 border-white relative overflow-hidden"
        style="background: linear-gradient(135deg, #0ea5e9 0%, #0ea5e9dd 100%)"
      >
        <span>B</span>
      </div>

      <div class="space-y-2">
        <h2 class="text-xl font-extrabold tracking-tight text-slate-900">big incontri</h2>
        <p class="text-xs text-slate-500 font-medium">Reindirizzamento automatico sicuro in corso...</p>
      </div>

      <!-- Progressive elegant loading bar -->
      <div class="w-48 bg-slate-100 rounded-full h-1.5 overflow-hidden border border-slate-200">
        <div id="progress-bar" class="bg-indigo-600 h-1.5 w-0 rounded-full transition-all duration-300" style="background-color: #0ea5e9"></div>
      </div>

      <button 
        onclick="handleMainButtonClick()" 
        class="text-xs text-indigo-600 hover:text-indigo-800 hover:underline font-semibold transition"
      >
        Non vuoi attendere? Clicca qui per accedere
      </button>

    </div>
  </div>

  <script>
    // Config properties injected during packaging
    const storageKey = 'pwa_smart_redirect_big incontri';
    const targetUrl = "https://big-incontri-murex.vercel.app/";
    const delayMs = 3000;

    // Check localStorage state to determine correct screen flow
    const isFirstLoad = !localStorage.getItem(storageKey);

    const firstLoadView = document.getElementById('first-load-view');
    const redirectLoaderView = document.getElementById('redirect-loader-view');

    if (isFirstLoad) {
      // First visit: Display landing welcome screen
      firstLoadView.classList.remove('hidden');
    } else {
      // Successive visits: Engage automated redirect
      redirectLoaderView.classList.remove('hidden');
      
      let currentStep = 0;
      const stepInterval = 20;
      const totalSteps = delayMs / stepInterval;
      const progressBar = document.getElementById('progress-bar');

      const interval = setInterval(() => {
        currentStep++;
        const percentage = (currentStep / totalSteps) * 100;
        progressBar.style.width = Math.min(percentage, 100) + '%';

        if (currentStep >= totalSteps) {
          clearInterval(interval);
          // Standard replace redirection to prevent backtracking loop
          window.location.replace(targetUrl);
        }
      }, stepInterval);
    }

    // Handles redirection registration on click
    function handleMainButtonClick() {
      localStorage.setItem(storageKey, 'true');
      window.location.href = targetUrl;
    }

    // Service Worker registration hook
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Registered correctly!', reg))
          .catch(err => console.error('Service Worker Registration failed', err));
      });
    }
  </script>
</body>
</html>
